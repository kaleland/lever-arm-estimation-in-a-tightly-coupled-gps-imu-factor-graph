[project]
name = "lever-arm"
version = "0.1.0"
description = "Lever arm estimation using GNSS and IMU sensor fusion"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "numba>=0.57.0",
    "pytest>=7.4.0",
    "pandas>=2.0.0",
    "folium>=0.14.0",
    "pyproj>=3.5.0",
    "r3f>=0.1.0",
    "inu==1.0.10",
    "tqdm>=4.64.1",
    "pyyaml>=6.0.0",
    
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factors", "graphs", "states", "util", "optimize", "observability_monitor", "sim"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
]
